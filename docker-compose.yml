# Operación Despliegue — docker-compose.yml
services:
  frontend:
    build:
      context: ./frontend
      provenance: false
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - frontend_net
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy

  catalog:
    build:
      context: ./catalog
      provenance: false
    env_file: .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  orders:
    build:
      context: ./orders
      provenance: false
    env_file: .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      provenance: false
    env_file: .env
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  cache:
    image: redis:7-alpine
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
